<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线留言 - 芯云智家</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #4f46e5 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .contact-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 50px;
            max-width: 600px;
            width: 100%;
        }

        .contact-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .contact-header h2 {
            font-size: 32px;
            font-weight: bold;
            color: #0f172a;
            margin-bottom: 10px;
        }

        .contact-header p {
            font-size: 16px;
            color: #64748b;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 8px;
        }

        .form-group label .required {
            color: #ef4444;
            margin-left: 2px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            color: #0f172a;
            transition: all 0.3s;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: #94a3b8;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #6366f1, #06b6d4);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.5);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .contact-info {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid #e2e8f0;
        }

        .contact-info h3 {
            font-size: 18px;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 20px;
            text-align: center;
        }

        .info-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: #475569;
        }

        .info-item .icon {
            width: 20px;
            height: 20px;
            background: linear-gradient(135deg, #6366f1, #06b6d4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 12px;
            flex-shrink: 0;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 30px;
            color: #4f46e5;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: #4338ca;
            text-decoration: underline;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #64748b;
            font-size: 14px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #e2e8f0;
            border-top-color: #4f46e5;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .contact-container {
                padding: 30px 25px;
            }

            .contact-header h2 {
                font-size: 26px;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }
        }
    </style>
</head>
<body>
    <div class="contact-container">
        <div class="contact-header">
            <h2>在线留言</h2>
            <p>留下您的联系方式，我们会尽快与您联系</p>
        </div>

        <form id="contactForm" action="https://formsubmit.co/6a51037346fe5cecbd956345a65bdfd6" method="POST">
            <!-- FormSubmit 配置 -->
            <input type="hidden" name="_subject" value="芯云智家官网收到一条新留言">
            <input type="hidden" name="_captcha" value="false">
            <input type="hidden" name="_template" value="table">
            <input type="hidden" name="_redirect" value="success.html">
            <input type="hidden" name="_blacklist" value="spam">
            
            <div class="form-group">
                <label>您的姓名<span class="required">*</span></label>
                <input type="text" name="姓名" placeholder="请输入您的姓名" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>联系邮箱<span class="required">*</span></label>
                    <input type="email" name="email" placeholder="请输入您的邮箱" required>
                </div>
                <div class="form-group">
                    <label>联系电话</label>
                    <input type="tel" name="电话" placeholder="请输入您的电话">
                </div>
            </div>

            <div class="form-group">
                <label>公司名称</label>
                <input type="text" name="公司" placeholder="请输入您的公司名称">
            </div>

            <div class="form-group">
                <label>留言内容<span class="required">*</span></label>
                <textarea name="留言内容" rows="5" placeholder="请描述您的需求或问题..." required></textarea>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">提交留言</button>
            
            <div class="loading" id="loading">
                <span class="spinner"></span>
                正在提交...
            </div>
        </form>

        <div class="contact-info">
            <h3>其他联系方式</h3>
            <div class="info-list">
                <div class="info-item">
                    <span class="icon">📞</span>
                    <span>电话：+86 123 4567 8900</span>
                </div>
                <div class="info-item">
                    <span class="icon">✉️</span>
                    <span>邮箱：710880878@qq.com</span>
                </div>
                <div class="info-item">
                    <span class="icon">📍</span>
                    <span>地址：广东省惠州市惠城区中电北斗芯创谷</span>
                </div>
            </div>
        </div>

        <a href="javascript:history.back()" class="back-link">← 返回上一页</a>
    </div>

    <script>
        // 表单提交处理
        const form = document.getElementById('contactForm');
        const submitBtn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');

        form.addEventListener('submit', function() {
            submitBtn.disabled = true;
            submitBtn.style.display = 'none';
            loading.classList.add('active');
        });
    </script>
</body>
</html>
